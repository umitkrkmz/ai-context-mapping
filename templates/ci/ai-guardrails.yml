# AI guardrails for an adopted project. Written by scripts/adopt.py --ci from the
# ai-context-mapping framework; edit freely. The checks are the same ones the pre-commit
# hook runs, so a commit made with SKIP_AI_GUARDRAILS=1 is still checked here.
name: AI Guardrails

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Project map is current
        run: python scripts/init_mapping.py --check --no-color

      - name: Architectural invariants hold
        run: python scripts/verify_invariants.py --no-color

      - name: Dependency budget is respected
        run: python scripts/check_dependency_budget.py --no-color

      - name: Map describes every file (Python map test)
        if: hashFiles('tests/test_maps.py') != ''
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_maps.py

      - name: CLAUDE.md mirrors AGENTS.md
        if: hashFiles('CLAUDE.md') != ''
        run: diff -u AGENTS.md CLAUDE.md
