name: AI Guardrails

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ai-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the test runner
        run: python -m pip install pytest

      - name: Project map is current
        run: python scripts/init_mapping.py --check --no-color

      - name: Architectural invariants hold
        run: python scripts/verify_invariants.py --require-rules --no-color

      - name: Dependency budget is respected
        run: python scripts/check_dependency_budget.py --no-color

      - name: Self-guarding tests
        run: python -m pytest -q tests

      - name: MCP server answers a handshake
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_file_purpose","arguments":{"file_path":"AGENTS.md"}}}' \
            | python mcp/context_server.py | tee mcp-output.txt
          grep -q '"read_project_map"' mcp-output.txt
          grep -q 'Category: manifesto' mcp-output.txt

  mirror:
    name: CLAUDE.md mirrors AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare files
        run: |
          if [ -L CLAUDE.md ]; then
            test "$(readlink CLAUDE.md)" = "AGENTS.md"
          else
            diff -u AGENTS.md CLAUDE.md
          fi
